name: 发布 Android APK

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Release 标签名（例如 v1.0.0，留空则使用 package.json 版本）'
        required: false
        type: string

permissions:
  contents: write

jobs:
  release-android:
    runs-on: ubuntu-latest
    steps:
      - name: 检出仓库
        uses: actions/checkout@v4

      - name: 安装 pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.5.0

      - name: 配置 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: 配置 JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: 配置 Gradle 缓存
        uses: gradle/actions/setup-gradle@v4

      - name: 写入项目配置密钥
        env:
          PROJECT_CONFIG_KEY_FILE: ${{ secrets.PROJECT_CONFIG_KEY_FILE }}
        run: |
          if [[ -z "$PROJECT_CONFIG_KEY_FILE" ]]; then
            echo "缺少 GitHub Secret: PROJECT_CONFIG_KEY_FILE" >&2
            exit 1
          fi
          printf '%s\n' "$PROJECT_CONFIG_KEY_FILE" > .project-config.key

      - name: 安装依赖
        run: pnpm install --frozen-lockfile

      - name: 拉取 Android 签名密钥库
        run: npm run task -- external-lfs:pull -- --file private/android/android-release.p12

      - name: 加载 Android 签名配置
        run: pnpm exec tsx scripts/public/prepare-android-signing.ts

      - name: 计算 Release 版本
        id: release_version
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            tag="$GITHUB_REF_NAME"
          elif [[ -n "${{ inputs.tag_name }}" ]]; then
            tag="${{ inputs.tag_name }}"
          else
            tag="v$(node -p "require('./package.json').version")"
          fi
          if [[ ! "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]; then
            echo "Release 标签必须是 v 开头的语义化版本，例如 v1.0.0。" >&2
            exit 1
          fi
          echo "tag_name=$tag" >> "$GITHUB_OUTPUT"
          echo "version_name=${tag#v}" >> "$GITHUB_OUTPUT"

      - name: 构建 Android Web 资源
        run: pnpm task build:web:pure-frontend --env ./.env/.env.production.pure-frontend

      - name: 同步 Capacitor Android 工程
        run: pnpm task capacitor:sync:android --env ./.env/.env.production.pure-frontend

      - name: 构建未签名 Release APK
        env:
          ANDROID_VERSION_CODE: ${{ github.run_number }}
          ANDROID_VERSION_NAME: ${{ steps.release_version.outputs.version_name }}
        run: |
          chmod +x android/gradlew
          ./android/gradlew -p android :app:assembleRelease

      - name: 签名并验证 APK
        env:
          TAG_NAME: ${{ steps.release_version.outputs.tag_name }}
        shell: bash
        run: |
          for name in ANDROID_KEYSTORE_PATH ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD; do
            if [[ -z "${!name}" ]]; then
              echo "缺少 Android 签名配置: $name" >&2
              exit 1
            fi
          done
          apksigner_path="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          if [[ -z "$apksigner_path" ]]; then
            echo '未找到 Android SDK apksigner。' >&2
            exit 1
          fi
          mkdir -p release/android
          output="release/android/android-smb-$TAG_NAME-arm64-v8a.apk"
          "$apksigner_path" sign \
            --ks "$ANDROID_KEYSTORE_PATH" \
            --ks-key-alias "$ANDROID_KEY_ALIAS" \
            --ks-pass env:ANDROID_KEYSTORE_PASSWORD \
            --key-pass env:ANDROID_KEY_PASSWORD \
            --out "$output" \
            android/app/build/outputs/apk/release/app-release-unsigned.apk
          "$apksigner_path" verify --verbose --print-certs "$output"

      - name: 发布 GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release_version.outputs.tag_name }}
          generate_release_notes: true
          files: release/android/*.apk
